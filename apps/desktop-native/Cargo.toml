[package]
name = "suffice-desktop-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
egui_commonmark = { version = "=0.20.0", default-features = false, features = ["pulldown_cmark"] }
serde_json = "=1.0.151"
suffice-session = { path = "../../crates/suffice-session" }
