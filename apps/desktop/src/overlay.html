<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>document.documentElement.dataset.chrome = 'glass'; try { document.documentElement.dataset.theme = localStorage.getItem('suffice-theme') === 'light' ? 'light' : 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suffice overlay</title>
  </head>
  <body class="overlay-window">
    <div id="overlay"></div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
