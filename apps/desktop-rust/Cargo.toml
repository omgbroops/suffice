[package]
name = "suffice-desktop-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
serde_json = "=1.0.151"
tao = "=0.37.1"
wry = "=0.57.2"
rfd = { version = "0.15", features = ["common-controls-v6"] }
url = "2"
getrandom = "=0.3.4"
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "ico", "tiff"] }
trash = {version = "=5.3.0", default-features = false, features=["freedesktop","coinit_apartmentthreaded"]}

[target.'cfg(any(windows,target_os = "macos"))'.dependencies]
file_icon_provider = "=1.0.2"
notify-rust = {version="=4.19.0",default-features=false,features=["preview-macos-un"]}

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = "=3.7.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"
objc2-app-kit = {version="=0.3.2",default-features=false,features=["NSPasteboard","NSPasteboardItem"]}
block2 = "=0.6.2"
objc2-foundation = {version="=0.3.2",default-features=false,features=["NSDate","NSSet","NSString"]}
objc2-web-kit = {version="=0.3.2",default-features=false,features=["WKWebsiteDataRecord","WKWebsiteDataStore","WKWebViewConfiguration","block2"]}
