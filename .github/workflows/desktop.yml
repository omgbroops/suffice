name: Desktop reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_ENABLE_LOGGING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Isolate test account state
        run: echo "SUFFICE_HOME=$RUNNER_TEMP/suffice-ci" >> "$GITHUB_ENV"
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Record runtime versions
        run: |
          mkdir -p .ci-logs
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})' | tee .ci-logs/runtime.log
          bun --version | tee -a .ci-logs/runtime.log
          git --version | tee -a .ci-logs/runtime.log
      - name: Build renderer
        id: build
        run: |
          set -o pipefail
          bun run desktop:build 2>&1 | tee .ci-logs/build.log
      - name: Core and CLI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          node --test tests/*.test.mjs packages/cli/test/*.test.mjs 2>&1 | tee .ci-logs/core.log
      - name: Serialized Electron tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          node --test --test-concurrency=1 apps/desktop/test/*.test.mjs 2>&1 | tee .ci-logs/desktop.log
      - name: Retain logs and fixture screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .ci-logs/
            apps/desktop/desktop-*.png
            apps/desktop/settings-*.png
            apps/desktop/sidebar-*.png
            apps/desktop/spotlight-*.png
