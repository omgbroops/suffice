name: Desktop reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Run reliability tests or build preview installers
        type: choice
        options: [tests, installers]
        default: tests

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: (github.event_name != 'workflow_dispatch' || inputs.task != 'installers') && github.head_ref != 'codex/desktop-installers' && github.ref_name != 'codex/desktop-installers'
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_ENABLE_LOGGING: '1'
      RUSTUP_TOOLCHAIN: '1.92.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Isolate test account state
        run: echo "SUFFICE_HOME=$RUNNER_TEMP/suffice-ci" >> "$GITHUB_ENV"
      - name: Prepare Rust build tools
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Record runtime versions
        run: |
          mkdir -p .ci-logs
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})' | tee .ci-logs/runtime.log
          bun --version | tee -a .ci-logs/runtime.log
          git --version | tee -a .ci-logs/runtime.log
      - name: Build renderer
        id: build
        run: |
          set -o pipefail
          bun run desktop:build 2>&1 | tee .ci-logs/build.log
      - name: Build and check native traversal
        run: |
          bun run native:build
          cargo fmt --manifest-path crates/suffice-fs/Cargo.toml -- --check
          cargo fmt --manifest-path crates/suffice-fs-addon/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/suffice-fs-addon/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/suffice-fs/Cargo.toml
          cargo test --locked --manifest-path crates/suffice-fs-addon/Cargo.toml
      - name: Check experimental session core and native viewer
        env:
          PI_OFFLINE: '1'
        run: |
          set -o pipefail
          cargo fmt --manifest-path crates/suffice-session/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/suffice-session/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/suffice-session/Cargo.toml
          # Rebuild before the Pi differential suite: never test a stale executable.
          cargo build --locked --manifest-path crates/suffice-session/Cargo.toml
          node --test crates/suffice-session/tests/*.test.mjs 2>&1 | tee .ci-logs/session.log
          cargo fmt --manifest-path apps/desktop-native/Cargo.toml -- --check
          cargo clippy --locked --manifest-path apps/desktop-native/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path apps/desktop-native/Cargo.toml
          cargo build --release --locked --manifest-path apps/desktop-native/Cargo.toml
          node --test apps/desktop-bridge/*.test.mjs 2>&1 | tee .ci-logs/bridge.log
      - name: Check experimental persistent session boundary
        env:
          PI_OFFLINE: '1'
        run: |
          set -o pipefail
          cargo fmt --manifest-path crates/suffice-session-addon/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/suffice-session-addon/Cargo.toml --all-targets -- -D warnings
          bun run session:native:build 2>&1 | tee .ci-logs/session-addon-build.log
          node --test crates/suffice-session-addon/tests/*.test.mjs apps/desktop-bridge/test/*.test.mjs 2>&1 | tee .ci-logs/session-addon.log
      - name: Check experimental desktop host and lifecycle
        env:
          PI_OFFLINE: '1'
        run: |
          set -o pipefail
          cargo fmt --manifest-path apps/desktop-rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path apps/desktop-rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path apps/desktop-rust/Cargo.toml
          node --test apps/desktop-rust/start-bridge.test.mjs apps/desktop-rust/owned-process-hook.test.mjs 2>&1 | tee .ci-logs/host-lifecycle.log
      - name: Core and CLI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          node --test tests/*.test.mjs packages/cli/test/*.test.mjs 2>&1 | tee .ci-logs/core.log
      - name: Serialized Electron tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          node --test --test-concurrency=1 apps/desktop/test/*.test.mjs 2>&1 | tee .ci-logs/desktop.log
      - name: Retain logs and fixture screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .ci-logs/
            apps/desktop/desktop-*.png
            apps/desktop/settings-*.png
            apps/desktop/sidebar-*.png
            apps/desktop/spotlight-*.png

  installers:
    if: (github.event_name == 'workflow_dispatch' && inputs.task == 'installers') || (github.event_name == 'push' && github.ref_name == 'codex/desktop-installers')
    name: Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: xcode-27
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PI_OFFLINE: '1'
      RUSTUP_TOOLCHAIN: '1.92.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Isolate account state
        run: echo "SUFFICE_HOME=$RUNNER_TEMP/suffice-package" >> "$GITHUB_ENV"
      - name: Prepare native Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Install pinned build/runtime dependencies
        run: bun install --frozen-lockfile
      - name: Build renderer
        run: bun run desktop:build
      - name: Build native preview installer
        run: bun run desktop:installer
      - name: Test the packaged application
        run: bun run desktop:smoke
      - name: Verify macOS disk image and app signature
        if: runner.os == 'macOS'
        run: |
          hdiutil verify release/*.dmg
          mkdir -p "$RUNNER_TEMP/suffice-mount" "$RUNNER_TEMP/suffice-installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/suffice-mount" release/*.dmg
          cp -R "$RUNNER_TEMP/suffice-mount/Suffice.app" "$RUNNER_TEMP/suffice-installed/"
          hdiutil detach "$RUNNER_TEMP/suffice-mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/suffice-installed/Suffice.app"
          node scripts/desktop/smoke.mjs "$RUNNER_TEMP/suffice-installed/Suffice.app/Contents/MacOS/Suffice"
      - name: Verify installer archive and record checksums
        run: node scripts/desktop/verify.mjs
      - name: Retain installer and validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Suffice-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS.txt
            release/packaged-smoke-*.json
            release/packaged-smoke-*.png
            release/build-result.json
            release/installer-validation.json
